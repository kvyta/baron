:root{
  --bg0:#08201d; --bg1:#12463f; --bg2:#1b6b5d;
  --panel:#2c3239; --panel2:#3a4149; --panel3:#464e58;
  --ink:#0a0d10;
  --white:#f4f6f7;
  --chip:#0093ff; --mult:#fe5f55; --gold:#ffc93d; --green:#35bd86; --purple:#9a5bd6; --orange:#ff8c33;
  --card:#fbf7ee;
  --event:#e2564c;
  --row:22px;
  --f-disp:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-ui); color:var(--white);
  background:var(--bg0); overflow:hidden;
  font-size:15px;
}
button{font-family:inherit}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 42%, var(--bg2) 0%, var(--bg1) 38%, var(--bg0) 78%);overflow:hidden}
#bg::before{
  content:'';position:absolute;left:-60%;top:-60%;width:220%;height:220%;
  background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.035) 0deg 5deg, rgba(0,0,0,0) 5deg 10deg);
  animation:spin 120s linear infinite;
}
#bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ chunky primitives ============ */
.outline{ text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink); }
.panel{
  background:var(--panel); border:3px solid var(--ink); border-radius:12px;
  box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.09);
  padding:10px;
}
.btn{
  font-family:var(--f-disp); font-size:15px; letter-spacing:.4px;
  color:#fff; background:var(--panel3); border:3px solid var(--ink); border-radius:10px;
  padding:7px 11px 8px; cursor:pointer; position:relative; top:0;
  box-shadow:0 4px 0 rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.16);
  transition:top .06s, box-shadow .06s, filter .12s; white-space:nowrap;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{top:4px;box-shadow:0 0 0 rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.16)}
.btn.blue{background:var(--chip)} .btn.red{background:var(--mult)} .btn.gold{background:var(--gold);color:#3a2c00}
.btn.green{background:var(--green)} .btn.purple{background:var(--purple)} .btn.orange{background:var(--orange)}
.btn.sm{font-size:13px;padding:5px 8px 6px;border-width:2px;box-shadow:0 3px 0 rgba(0,0,0,.55)}
.btn.sm:active{top:3px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon{width:36px;height:34px;padding:0;display:grid;place-items:center;font-size:16px}

/* ============ layout ============ */
#app{position:relative;height:100vh;height:100dvh;display:flex;gap:12px;padding:12px;overflow:hidden}
.rail{width:266px;flex:0 0 266px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding-bottom:2px}
.rail::-webkit-scrollbar{width:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}

.logo{
  font-family:var(--f-disp); font-size:27px; line-height:1; text-align:center;
  padding:10px 6px 9px; letter-spacing:1px;
  background:linear-gradient(#e33c33,#b8241d); border:3px solid var(--ink); border-radius:12px;
  box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.25);
}
.logo small{display:block;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:3px;opacity:.85;margin-top:3px}

/* blind panel */
.blind{background:linear-gradient(#3a4149,#2a3037);text-align:center;padding:11px 10px 12px}
.blind .tag{
  display:inline-block;font-family:var(--f-disp);font-size:14px;padding:3px 12px 4px;border-radius:20px;
  background:var(--mult);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.5);margin-bottom:8px;
}
.blind .lbl{font-size:10px;font-weight:900;letter-spacing:2.4px;opacity:.7;margin-bottom:2px}
.blind .target{font-family:var(--f-disp);font-size:36px;line-height:1;color:var(--mult)}
.blind .reward{font-size:11px;font-weight:700;opacity:.75;margin-top:5px}

.scorebox{background:#1b2026;border:3px solid var(--ink);border-radius:10px;padding:9px 10px;text-align:center;box-shadow:inset 0 3px 10px rgba(0,0,0,.5)}
.scorebox .lbl{font-size:9.5px;font-weight:900;letter-spacing:2.2px;opacity:.6}
.scorebox .val{font-family:var(--f-disp);font-size:40px;line-height:1.05;color:var(--white);transition:transform .12s}
.scorebox.pop .val{transform:scale(1.22)}
.meter{height:12px;border:2px solid var(--ink);border-radius:7px;background:#11151a;margin-top:8px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--chip),#63c3ff);transition:width .45s cubic-bezier(.2,1.3,.4,1)}
.meter.win i{background:linear-gradient(90deg,var(--green),#8ff0c2)}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--panel2);border:2px solid var(--ink);border-radius:9px;padding:6px 7px;text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.stat .k{font-size:8.5px;font-weight:900;letter-spacing:1.6px;opacity:.62}
.stat .v{font-family:var(--f-disp);font-size:21px;line-height:1.15}
.stat.hot .v{color:var(--orange)}
.stat.cash .v{color:var(--gold)}
.stat.rank .v{color:var(--mult)}
.scorebox .val #scoreVal{color:var(--chip)}
.goldtxt{color:var(--gold)}

.railbtns{display:grid;gap:7px}
.railbtns .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hint{font-size:10.5px;line-height:1.45;opacity:.55;padding:0 3px}

/* sealed past days: visibly a record, not a workspace */
.blk.locked,.lrow.locked{cursor:default;opacity:.92}
.blk.locked:hover{transform:none;box-shadow:0 3px 0 rgba(0,0,0,.5);filter:none}
.lrow.locked:hover{transform:none;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.grid.sealed .lines{opacity:.5}

/* the 10-minute heads-up */
.alert{
  position:fixed;right:16px;bottom:16px;z-index:95;width:300px;
  background:var(--panel);border:4px solid var(--ink);border-radius:14px;padding:12px 14px;
  box-shadow:0 8px 0 rgba(0,0,0,.5);animation:alertin .3s cubic-bezier(.2,1.6,.4,1);cursor:pointer;
}
.alert .k{font-family:var(--f-disp);font-size:15px;color:var(--gold);letter-spacing:.5px}
.alert .t{font-weight:900;font-size:17px;margin-top:3px;line-height:1.2}
.alert .w{font-size:11.5px;font-weight:800;opacity:.6;margin-top:3px}
.alert .x{position:absolute;top:6px;right:8px;font-size:13px;opacity:.5}
@keyframes alertin{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* tabs */
.tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tab{
  font-family:var(--f-disp);font-size:17px;padding:7px 16px 8px;border:3px solid var(--ink);border-radius:11px;
  background:var(--panel2);color:#c8cfd6;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5);position:relative;top:0;
}
.tab.on{background:var(--gold);color:#3a2c00;top:0;box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.4)}
.tab:active{top:4px;box-shadow:0 0 0}
.spacer{flex:1}
.datenav{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--ink);border-radius:11px;padding:3px 5px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.datenav .d{font-family:var(--f-disp);font-size:16px;min-width:0;flex:1;text-align:center;cursor:default;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.datenav .d span{display:block;font-family:var(--f-ui);font-size:9px;font-weight:900;letter-spacing:2px;opacity:.6;margin-top:-2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.navbtn{width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;background:var(--panel3);color:#fff;cursor:pointer;font-size:14px;flex:0 0 auto;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.navbtn:active{transform:translateY(3px);box-shadow:none}

.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.view[hidden]{display:none}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ============ day grid ============ */
.gridwrap{
  flex:1;min-height:0;overflow:auto;background:rgba(12,20,19,.72);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.4), inset 0 2px 20px rgba(0,0,0,.5);
  padding:8px 10px 22px;
}
.gridwrap::-webkit-scrollbar{width:11px;height:11px}
.gridwrap::-webkit-scrollbar-track{background:rgba(0,0,0,.3);border-radius:8px}
.gridwrap::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;border:2px solid rgba(0,0,0,.5)}
.grid{
  display:grid;grid-template-columns:56px 1fr;grid-template-rows:repeat(96,var(--row));
  position:relative;user-select:none;
}
.lines{
  grid-column:2/3;grid-row:1/-1;pointer-events:none;z-index:0;border-radius:6px;
  position:relative;overflow:hidden;
}
/* hours outside the SOD-EOD window: collapsed to zero height by default, tinted purple when revealed */
.zone{position:absolute;left:0;right:0;background:rgba(196,116,214,.17);border-radius:5px}
.hline{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background:rgba(255,255,255,.13)}
.qline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.045)}
.tl{
  grid-column:1/2;font-family:var(--f-disp);font-size:13px;color:#9fb0ad;
  padding-right:9px;text-align:right;line-height:1;padding-top:2px;
}
.tl.noon{color:var(--gold)}
.tl.dim{font-size:10px;color:#7d6f92;opacity:.75;padding-top:0}
.cell{
  grid-column:2/3;z-index:1;border-radius:5px;cursor:crosshair;position:relative;
}
.cell:hover{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.cell:hover::after{
  content:attr(data-t) '  +';position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:800;letter-spacing:1px;opacity:.75;pointer-events:none;
}
.paintpv{
  position:absolute;left:0;right:0;z-index:6;pointer-events:none;border-radius:8px;
  background:rgba(255,201,61,.3);border:3px dashed var(--gold);
}
.paintpv b{position:absolute;left:9px;top:4px;font-family:var(--f-disp);font-size:14px;color:#fff;text-shadow:0 2px 0 #000}

/* block cards */
.blk{
  grid-column:2/3;z-index:3;position:relative;
  background:var(--card);color:#1a1d21;border:3px solid var(--ink);border-radius:9px;
  box-shadow:0 3px 0 rgba(0,0,0,.5);
  margin:1px 2px;padding:2px 8px 2px 12px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;
  transition:transform .12s cubic-bezier(.2,1.6,.4,1), box-shadow .12s, filter .12s;
}
.blk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c,#888)}
.blk:hover{transform:translateY(-2px) rotate(-.5deg) scale(1.012);box-shadow:0 6px 0 rgba(0,0,0,.5);z-index:7;filter:brightness(1.03)}
.blk .t{font-weight:900;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{font-size:10px;font-weight:700;opacity:.62;line-height:1.2;white-space:nowrap;overflow:hidden}
.blk.tiny{padding:0 8px 0 12px;flex-direction:row;align-items:center;justify-content:flex-start;gap:7px}
.blk.tiny .t{font-size:11.5px}
.blk.tiny .s{display:none}
.blk .tick{
  position:absolute;right:5px;top:4px;width:22px;height:22px;border-radius:7px;
  border:2px solid var(--ink);background:#fff;color:#1a1d21;display:grid;place-items:center;
  font-size:13px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.blk.tiny .tick{top:50%;transform:translateY(-50%);width:19px;height:19px;font-size:11px}
.blk .tick:hover{background:var(--green);color:#fff}
.blk.done{background:#dfe6df}
.blk.done .t{text-decoration:line-through;opacity:.62}
.blk .grade{
  position:absolute;right:4px;top:50%;transform:translateY(-50%) rotate(-11deg);
  font-family:var(--f-disp);font-size:26px;line-height:1;padding:0 8px 2px;border-radius:8px;
  border:3px solid var(--ink);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.blk.tiny .grade{font-size:17px;border-width:2px;padding:0 6px 1px}
/* NEGATIVE block — Balatro's Negative edition: inverted, high contrast, see-through */
.blk.neg,.blk.neg.done{
  background:rgba(14,6,34,.66);color:#fff;border:3px solid #fff;text-shadow:0 1px 0 #000;
  -webkit-backdrop-filter:invert(1) hue-rotate(180deg);backdrop-filter:invert(1) hue-rotate(180deg);
  box-shadow:0 0 0 2px #000, 0 3px 0 2px rgba(0,0,0,.5);
}
.blk.neg::before{background:#fff}
.blk.neg .t{text-decoration:none;opacity:1;letter-spacing:2px;font-family:var(--f-disp)}
.blk.neg .s{opacity:.85}
.blk.neg .grade{background:#000;color:#fff;border-color:#fff;box-shadow:0 0 0 2px #000,0 3px 0 2px rgba(0,0,0,.4)}
.neghint{margin:-4px 0 10px;padding:8px 10px;border:2px dashed #fff;border-radius:8px;background:rgba(0,0,0,.45);color:#fff}
.btn.negbtn{background:#000;color:#fff;box-shadow:0 0 0 2px #fff}
.blk.evt{background:var(--event);color:#fff}
.blk.evt::before{background:rgba(0,0,0,.35)}
.blk.evt .s{opacity:.85}
.blk .evtagt{
  position:absolute;right:5px;top:4px;font-size:9px;font-weight:900;letter-spacing:1.3px;
  padding:2px 7px;border-radius:6px;border:2px solid var(--ink);background:rgba(0,0,0,.32);color:#fff;
}
.blk.tiny .evtagt{top:50%;transform:translateY(-50%)}
.blk.now{animation:blkpulse 1.4s ease-in-out infinite}
@keyframes blkpulse{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 0 rgba(255,201,61,.6)}50%{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 7px rgba(255,201,61,0)}}
.rz{position:absolute;left:0;right:0;bottom:0;height:11px;cursor:ns-resize;z-index:9}
@media (hover:none){ .rz{display:none} }   /* touch can't drag-resize — times change in the block editor */
.rz::after{content:'';position:absolute;left:50%;bottom:2px;width:28px;height:3px;margin-left:-14px;border-radius:3px;background:rgba(0,0,0,.3);opacity:0}
.blk:hover .rz::after{opacity:1}

/* now line */
.nowline{position:absolute;left:56px;right:0;height:0;z-index:8;pointer-events:none}
.nowline i{position:absolute;left:0;right:0;top:-1.5px;height:3px;background:var(--mult);box-shadow:0 0 10px rgba(254,95,85,.9)}
.nowline b{
  position:absolute;left:-52px;top:-11px;font-family:var(--f-disp);font-size:11px;background:var(--mult);
  border:2px solid var(--ink);border-radius:6px;padding:0 5px 1px;box-shadow:0 2px 0 rgba(0,0,0,.5);
  animation:nowb 2s ease-in-out infinite;
}
@keyframes nowb{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
/* start-of-day / end-of-day markers — collapsible, icon sits left of the line */
.edge{position:absolute;left:56px;right:0;height:0;z-index:7;pointer-events:none}
.edge i{position:absolute;left:0;right:0;top:-1.5px;height:3px;background:var(--purple);box-shadow:0 0 8px rgba(154,91,214,.75)}
.edge b{
  position:absolute;left:-52px;top:-11px;font-family:var(--f-disp);font-size:11px;background:var(--purple);
  border:2px solid var(--ink);border-radius:6px;padding:0 5px 1px;box-shadow:0 2px 0 rgba(0,0,0,.5);
  pointer-events:auto;cursor:pointer;white-space:nowrap;
}
.edge b:hover{filter:brightness(1.15)}
.emptyday{position:absolute;left:56px;right:0;text-align:center;font-family:var(--f-disp);font-size:19px;color:rgba(255,255,255,.35);pointer-events:none}

/* daily view layout: the TIMELINE + a per-task TODAY/WEEK done-time side panel */
.daybody{flex:1;min-height:0;display:flex;gap:10px;overflow:hidden}
.daymain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dayinfo{width:230px;flex:0 0 230px;display:flex;flex-direction:column;overflow:hidden}
/* split top/bottom, exactly in half — TODAY above, WEEK (Sun–Sat) below,
   each its own label + a scrollable, sorted per-task list */
.dnstat{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:8px 0}
.dnstat.top{border-bottom:2px solid rgba(255,255,255,.15)}
.dnstat .dnlbl{flex:0 0 auto;font-size:10px;font-weight:900;letter-spacing:2px;opacity:.55;margin-bottom:7px}
.dnstat .dnlist{flex:1;min-height:0;overflow-y:auto;display:grid;gap:6px;align-content:start;padding-right:2px}
.dnempty{font-size:10px;opacity:.4;text-align:center;padding:6px 0;font-weight:700}
/* blue = task/block color, red = event color — same convention the timeline
   and CALENDAR grid use elsewhere. Events sort above tasks as their own
   group (see renderDnList in 04-day.js), so the red/blue split reads as two
   bands rather than an interleaved list. */
.ttrow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--chip);color:#fff;border:2px solid var(--ink);border-radius:7px;padding:5px 7px;font-size:11px;font-weight:800;line-height:1.25}
.ttrow .amt{flex:0 0 auto;font-size:10px;opacity:.85}
.ttrow.evt{background:var(--event)}
.ttrow.allday{background:var(--gold);color:#3a2c00}
select.inp:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1)}

/* ============ shared segmented control + list-panel chrome ============
   .segwrap/.seg are used by TASKS and STATS' filter rows; .listwrap/.list
   are the QUOTAS tab's own list container. DAILY's TIMELINE/LIST toggle and
   its LIST rendering (.lhdr/.lrow/.lgap/.lempty) are gone — TIMELINE is now
   the only DAILY view. */
.segwrap{display:flex;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.seg{font-family:var(--f-disp);font-size:14px;padding:6px 13px 7px;border:3px solid var(--ink);background:var(--panel2);color:#c8cfd6;cursor:pointer}
.segwrap .seg:first-child{border-right-width:2px;border-radius:10px 0 0 10px}
.segwrap .seg:last-child{border-left:none;border-radius:0 10px 10px 0}
.segwrap .seg:not(:first-child):not(:last-child){border-left:none;border-right-width:2px}
.seg.on{background:var(--gold);color:#3a2c00}
.listwrap{flex:1;min-height:0;overflow:auto;background:rgba(12,20,19,.72);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.4), inset 0 2px 20px rgba(0,0,0,.5);padding:14px}
.listwrap[hidden]{display:none}
.list{display:grid;gap:7px;max-width:920px;margin:0 auto}

/* ============ tasks ============ */
.tkwrap{flex:1;min-height:0;overflow:auto;background:rgba(12,20,19,.72);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.4), inset 0 2px 20px rgba(0,0,0,.5);padding:14px}
.tklist{display:grid;gap:8px;max-width:900px;margin:0 auto}
.tkrow{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;
  padding:8px 10px 8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.42);position:relative;overflow:hidden;
}
.tkrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--chip)}
.tkrow.hid{opacity:.48}
.tkrow.hid::before{background:#6b7780}
.tkrow .nm{
  flex:1;min-width:0;background:transparent;border:2px solid transparent;color:#fff;
  font-family:var(--f-ui);font-weight:800;font-size:15px;padding:6px 8px;border-radius:7px;
}
.tkrow .nm:hover{border-color:rgba(255,255,255,.14)}
.tkrow .nm:focus{outline:none;background:#1b2026;border-color:var(--gold)}
.tkrow .nmtxt{
  flex:1;min-width:0;color:#fff;font-family:var(--f-ui);font-weight:800;font-size:15px;
  padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tkrow .hidtag{
  font-size:9px;font-weight:900;letter-spacing:1.5px;color:#0e1518;background:#6b7780;
  border-radius:5px;padding:2px 6px;flex:0 0 auto;
}
.tkrow .hrs{font-family:var(--f-disp);font-size:18px;color:var(--chip);min-width:74px;text-align:right;flex:0 0 auto}
.tkrow.hid .hrs{color:#8fa0a8}
.tkrow .cnt{font-size:10px;font-weight:800;opacity:.45;min-width:58px;text-align:right;flex:0 0 auto}
.tkhdr{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:900;letter-spacing:2px;opacity:.55;padding:0 8px 6px;max-width:900px;margin:0 auto}
.tkadd{display:flex;gap:8px;max-width:900px;margin:0 auto 12px}
.tkempty{text-align:center;font-family:var(--f-disp);font-size:19px;color:rgba(255,255,255,.35);padding:40px 0}

/* ============ calendar ============ */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calwrap{flex:1;min-height:0;overflow:auto;background:rgba(12,20,19,.72);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.4), inset 0 2px 20px rgba(0,0,0,.5);padding:10px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{text-align:center;font-size:10px;font-weight:900;letter-spacing:2px;opacity:.55}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  aspect-ratio:1/2;min-height:0;background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:5px 6px;
  box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.07);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .1s cubic-bezier(.2,1.6,.4,1);display:flex;flex-direction:column;gap:3px;
}
.day:hover{transform:translateY(-3px) rotate(-.4deg);z-index:3}
.day.past{opacity:.62}
.day.alt{background:#30373e}
.calmon{grid-column:1/-1;font-family:var(--f-disp);font-size:17px;letter-spacing:.6px;padding:10px 4px 0;color:var(--white)}
.calmon:first-child{padding-top:0}
.dow{position:sticky;top:-10px;z-index:4;background:#0f1b19;margin:-10px -10px 6px;padding:8px 10px 6px;border-bottom:2px solid rgba(0,0,0,.4)}
.day .cq{font-size:10px;font-weight:800;border-radius:5px;padding:2px 5px;border:2px solid rgba(0,0,0,.55);color:#fff;background:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.day .cq.done{background:var(--green);color:#08251a;text-decoration:line-through}
.day .ev{cursor:pointer}
.day .ev:hover,.day .cq:hover{filter:brightness(1.15)}
.day.today{border-color:var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 0 3px rgba(255,201,61,.35)}
.day.sel{background:var(--panel3)}
.day .n{font-family:var(--f-disp);font-size:17px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.day .n em{font-style:normal;font-size:11px;font-family:var(--f-ui);font-weight:900;color:var(--gold)}
.day .ev{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;border:2px solid rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .more{font-size:9px;opacity:.6;font-weight:800}
.day .fill{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.1)}
.day .fill i{display:block;height:100%;background:var(--chip)}
.day .won{position:absolute;right:4px;bottom:8px;font-size:15px}
.agendapanel{padding:8px 8px 9px}
.agenda{display:grid;gap:4px}
.agrow{display:flex;gap:9px;align-items:center;background:var(--panel);border:2px solid var(--ink);border-radius:9px;padding:5px 9px;box-shadow:0 3px 0 rgba(0,0,0,.4);cursor:pointer}
.agrow .dot{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);flex:0 0 auto}
.agrow .w{flex:1;min-width:0}
.agrow .w b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agrow .w span{font-size:10px;opacity:.6;font-weight:800;letter-spacing:.4px}
.agrow:hover{filter:brightness(1.15)}
.agendapanel .panlbl.railq{margin-top:10px}
#railQuotas{display:grid;gap:4px}
#railQuotas .qrow{padding:5px 8px;font-size:11px;border-width:2px;border-radius:7px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.railqlbl{font-size:9px;font-weight:900;letter-spacing:1.5px;opacity:.45;padding:2px 1px 0}
#railQuotas .railqlbl:first-child{padding-top:0}

/* ============ quotas ============ */
.qsep{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 2px 6px;margin-top:4px}
.qsep:first-child{margin-top:0}
.qsep .lbl{font-family:var(--f-disp);font-size:14px;white-space:nowrap;letter-spacing:.4px}
.qsep .ln{flex:1;height:2px;background:rgba(255,255,255,.15)}
.qsep .plus{font-size:13px;font-weight:900;opacity:.4;flex:0 0 auto}
.qsep:hover .lbl{color:var(--gold)}
.qsep:hover .ln{background:var(--gold)}
.qsep:hover .plus{opacity:1;color:var(--gold)}
/* purple = quota color, matching blue = task and red = event elsewhere */
.qrow{display:flex;align-items:center;gap:9px;background:var(--purple);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.qrow .tx{flex:1;min-width:0;word-break:break-word}
.qrow.done{background:var(--green);color:#08251a}
.qrow.done .tx{text-decoration:line-through;opacity:.75}
.qrow:hover{filter:brightness(1.05)}

/* ============ modal ============ */
.scrim{position:fixed;inset:0;background:rgba(3,10,9,.72);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .16s}
.scrim[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 10px 0 rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.06) inset;padding:16px;animation:pop .22s cubic-bezier(.2,1.5,.4,1);
}
.modal.wide{width:min(660px,100%)}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 12px;font-family:var(--f-disp);font-size:25px;font-weight:400;display:flex;align-items:center;gap:9px}
.modal h3 .x{margin-left:auto}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:900;letter-spacing:2px;opacity:.62;margin-bottom:4px}
.inp{
  width:100%;background:#1b2026;color:#fff;border:3px solid var(--ink);border-radius:9px;padding:9px 10px;
  font-family:var(--f-ui);font-size:15px;font-weight:600;box-shadow:inset 0 3px 8px rgba(0,0,0,.5);
}
.inp:focus{outline:none;border-color:var(--gold)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:56px;font-weight:500}
.ro{background:#171b20;color:#c9d3d8;border-style:dashed;cursor:default}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* Nothing in a modal may be wider than the modal. iOS Safari gives date/time
   fields an intrinsic minimum width that ignores width:100%, and grid columns
   sized 1fr grow to fit their widest child — so every input may shrink, date
   and time fields drop the native look (keeping the native picker), and long
   button labels wrap instead of pushing out. */
.field,.two>*{min-width:0}
.inp{min-width:0;max-width:100%}
input[type=date].inp,input[type=time].inp,input[type=datetime-local].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;min-height:44px;text-align:left}
.inp::-webkit-date-and-time-value{text-align:left;margin:0}
.inp::-webkit-datetime-edit{padding:0}
select.inp{min-width:0;text-overflow:ellipsis}
.modal{overflow-x:hidden}
.modal .btn{max-width:100%;white-space:normal}
.modrow{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap;align-items:center}
.modrow .spacer{flex:1}

/* grade picker */
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:6px 0 4px}
.gcard{
  border:4px solid var(--ink);border-radius:12px;background:var(--card);color:#15181c;cursor:pointer;
  padding:12px 4px 10px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.5);position:relative;top:0;
  transition:transform .12s cubic-bezier(.2,1.7,.4,1),top .07s,box-shadow .07s;
}
.gcard:hover{transform:translateY(-6px) rotate(-2deg) scale(1.05);z-index:3}
.gcard:active{top:5px;box-shadow:0 0 0}
.gcard .g{font-family:var(--f-disp);font-size:40px;line-height:1;color:var(--c)}
.gcard .l{font-size:10px;font-weight:800;opacity:.62;line-height:1.15;margin-top:3px}
.gcard .k{position:absolute;left:5px;top:3px;font-size:9px;font-weight:900;opacity:.32}

/* grade fx */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center}
#fx[hidden]{display:none}
.fxgrade{
  font-family:var(--f-disp);font-size:150px;line-height:1;color:var(--c);
  text-shadow:-4px 0 #000,4px 0 #000,0 -4px #000,0 4px #000,0 10px 0 rgba(0,0,0,.45);
  animation:slam .28s cubic-bezier(.2,1.8,.4,1);
}
.fxlabel{font-family:var(--f-ui);font-weight:900;font-size:17px;letter-spacing:1px;margin-top:2px;text-shadow:0 2px 0 #000;opacity:.9}
@keyframes slam{from{transform:scale(2.6) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .38s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.parts{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.pt{position:absolute;width:16px;height:22px;border-radius:4px;border:2px solid var(--ink);animation:ptf 1.1s ease-out forwards}
@keyframes ptf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* recap */
.recap .head{text-align:center;margin-bottom:12px}
.recap .head .big{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold)}
.recap .head .sub{font-size:12px;font-weight:800;opacity:.7;letter-spacing:1px}
.lines2{display:grid;gap:6px;margin:10px 0}
.li{display:flex;align-items:center;gap:8px;background:#1b2026;border:2px solid var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.li .amt{margin-left:auto;font-family:var(--f-disp);font-size:19px;color:var(--gold)}
.bars{display:grid;gap:5px;margin-top:8px}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800}
.bar .nm{width:150px;flex:0 0 150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:15px;background:#151a1f;border:2px solid var(--ink);border-radius:7px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);width:0;border-radius:0 4px 4px 0;transition:width .6s cubic-bezier(.2,1.2,.4,1)}
.bar .vv{width:64px;text-align:right;opacity:.7;font-size:10.5px}

/* ============ stats ============ */
.statswrap{flex:1;min-height:0;overflow:auto;display:grid;gap:10px;align-content:start;padding-right:2px}
.chartpanel{padding:14px 14px 10px}
.charthdr{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap}
.charthdr h2{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:400}
.charthdr .sub{font-size:11px;font-weight:800;letter-spacing:1.4px;opacity:.5}
.chartlegend{display:flex;gap:14px;margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.6px}
.chartlegend span{display:flex;align-items:center;gap:6px;opacity:.85}
.chartlegend i{width:16px;height:3px;border-radius:2px;display:block}
.chartbox{position:relative;margin-top:8px}
.chartbox svg{display:block;width:100%;overflow:visible}
.ctip{
  position:absolute;pointer-events:none;z-index:5;background:#11171c;border:2px solid var(--ink);border-radius:9px;
  padding:7px 10px;box-shadow:0 4px 0 rgba(0,0,0,.5);white-space:nowrap;transform:translate(-50%,-115%);transition:opacity .1s;
}
.ctip b{display:block;font-family:var(--f-disp);font-size:16px;line-height:1.1}
.ctip span{font-size:10.5px;font-weight:800;opacity:.6;letter-spacing:.6px}
.ctip[hidden]{display:none}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px}
.scard{background:var(--panel);border:3px solid var(--ink);border-radius:11px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.07)}
.scard .k{font-size:9px;font-weight:900;letter-spacing:1.8px;opacity:.55}
.scard .v{font-family:var(--f-disp);font-size:30px;line-height:1.1;margin-top:2px}
.scard .s{font-size:10.5px;font-weight:700;opacity:.5}
.scard.good .v{color:var(--green)} .scard.hot .v{color:var(--orange)} .scard.blue .v{color:var(--chip)}
.scard.cashv .v{color:var(--gold)} .scard.rankv .v{color:var(--mult)}
.panlbl{font-size:10px;font-weight:900;letter-spacing:2px;opacity:.55;margin-bottom:7px}
.stable{width:100%;border-collapse:collapse;font-size:12.5px}
.stable th{text-align:left;font-size:9px;letter-spacing:1.6px;opacity:.55;padding:4px 8px;font-weight:900}
.stable td{padding:5px 8px;border-top:1px solid rgba(255,255,255,.08);font-weight:700}
.stable td.sc{font-family:var(--f-disp);font-size:16px}
.emptychart{text-align:center;font-family:var(--f-disp);font-size:19px;color:rgba(255,255,255,.35);padding:56px 10px}

.flash{animation:fl .4s}
@keyframes fl{0%{color:var(--green)}100%{color:inherit}}
.blk.pending{animation:pendglow 1.7s ease-in-out infinite}
@keyframes pendglow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 3px var(--gold),0 0 0 0 rgba(255,201,61,.55)}50%{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 3px var(--gold),0 0 0 9px rgba(255,201,61,0)}}
.blk.pending .tick,.lrow.pending .tick{background:var(--gold);color:#3a2c00}
#btnGrade{animation:gpulse 1.5s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.55), 0 0 0 0 rgba(255,201,61,.65)}60%{box-shadow:0 4px 0 rgba(0,0,0,.55), 0 0 0 10px rgba(255,201,61,0)}}
#btnMenu.need{background:var(--orange);animation:gpulse 1.6s ease-in-out infinite}

.kbd{display:inline-block;background:#1b2026;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;padding:1px 7px 2px;font-family:var(--f-disp);font-size:13px;margin-right:6px}
.helprow{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.helprow b{margin-left:auto;opacity:.75;font-weight:700;font-size:12px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--panel);border:3px solid var(--ink);border-radius:11px;padding:9px 16px;
  font-family:var(--f-disp);font-size:16px;box-shadow:0 5px 0 rgba(0,0,0,.5);animation:tin .25s cubic-bezier(.2,1.6,.4,1);
}
@keyframes tin{from{transform:translate(-50%,26px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.tlist{display:grid;gap:7px;max-height:270px;overflow-y:auto;overflow-x:hidden}
.trow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--ink);border-radius:9px;padding:7px 9px;font-size:13.5px;font-weight:800}
.trow.click{cursor:pointer;transition:filter .12s,border-color .12s}
.trow.click:hover{filter:brightness(1.22);border-color:var(--gold)}
.trow.click *{cursor:pointer}
.trow .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow small{opacity:.6;font-weight:700}

@media (max-width:920px){
  body{overflow:auto}
  #app{flex-direction:column;height:auto;min-height:100dvh}
  .rail{width:100%;flex:0 0 auto}
  .railbtns{grid-template-columns:1fr 1fr}
  .gridwrap,.listwrap,.tkwrap{height:70vh}
  .grid{grid-template-columns:48px 1fr}
  .nowline{left:48px}
  .edge{left:48px}
  .edge b{left:2px}
  .daybody{flex-direction:column}
  .dayinfo{width:100%;flex:0 0 auto;max-height:220px}
  .lrow .tm{width:118px;flex:0 0 118px;font-size:13.5px}
  .lrow .du{display:none}
  .bar .nm{width:110px;flex:0 0 110px}
  .grades{gap:5px}
  .gcard .g{font-size:26px}
}

/* ============ ☰ Menu → SAVING: one compact row per way of saving ============ */
.saving{display:grid;gap:6px}
.svrow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;align-items:center;background:#1b2026;border:2px solid var(--ink);border-radius:9px;padding:6px 7px 6px 10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.svk{font-size:9px;font-weight:900;letter-spacing:1.6px;opacity:.55}
.svs{font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svs i{font-style:normal;color:#8fa0a8} .svs i.ok{color:var(--green)} .svs i.wait{color:var(--gold)} .svs i.bad{color:var(--mult)}
.svb{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.svdropwrap{position:relative;display:inline-block}
.svdrop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;display:grid;gap:4px;min-width:230px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:5px;box-shadow:0 6px 0 rgba(0,0,0,.5)}
.svdrop[hidden]{display:none}
.svdrop button{display:block;text-align:left;background:#1b2026;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:7px 9px;cursor:pointer;font-family:var(--f-ui)}
.svdrop button:hover,.svdrop button:focus-visible{border-color:var(--gold);outline:none}
.svdrop b{display:block;font-family:var(--f-disp);font-weight:400;font-size:13px}
.svdrop small{display:block;font-size:10.5px;font-weight:700;opacity:.6;margin-top:1px}
.gbtn b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#fff;color:#4285f4;font-family:var(--f-ui);font-weight:900;font-size:11px;margin-right:4px;vertical-align:-2px;border:1.5px solid var(--ink)}
/* ============ cloud sync dot ============ */
.logo{position:relative}
.clouddot{position:absolute;top:7px;right:8px;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#6b7780}
.clouddot[hidden]{display:none}
.clouddot[data-s="idle"]{background:var(--green)}
.clouddot[data-s="syncing"]{background:var(--gold);animation:cdpulse 1s ease-in-out infinite}
.clouddot[data-s="offline"]{background:#8fa0a8}
.clouddot[data-s="error"]{background:var(--mult)}
@keyframes cdpulse{50%{opacity:.35}}

/* ============ phone bar + drawer (hidden on bigger screens) ============ */
.mbar,.railshade{display:none}

@media (max-width:700px){
  body{overflow:hidden;font-size:14px}
  #app{flex-direction:column;height:100vh;height:100dvh;min-height:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .mbar{display:flex;align-items:center;gap:6px;flex:0 0 auto;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:5px 6px;box-shadow:0 4px 0 rgba(0,0,0,.45);position:relative;cursor:pointer;margin-top:env(safe-area-inset-top)}
  .mlogo{font-family:var(--f-disp);font-size:20px;width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(#e33c33,#b8241d);border:2px solid var(--ink);border-radius:9px;flex:0 0 auto}
  .mst{flex:1;min-width:0;text-align:center;line-height:1.05}
  .mst span{display:block;font-size:8px;font-weight:900;letter-spacing:1.3px;opacity:.6}
  .mst b{font-family:var(--f-disp);font-weight:400;font-size:19px}
  .mbar .clouddot{position:static;flex:0 0 auto}
  .mbar .btn.icon{width:34px;height:32px}
  /* the rail becomes a drawer */
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:55;width:min(300px,86vw);flex:none;padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg0);border-right:3px solid var(--ink);box-shadow:6px 0 24px rgba(0,0,0,.6);transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto}
  body.railopen .rail{transform:none}
  body.railopen .railshade{display:block;position:fixed;inset:0;z-index:54;background:rgba(3,10,9,.6)}
  .railbtns{grid-template-columns:1fr}
  /* tabs scroll sideways rather than wrap */
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:5px;margin-bottom:-5px;gap:5px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-size:14px;padding:6px 10px 7px;flex:0 0 auto}
  .tabs .spacer{display:none}
  #btnHelp,#btnSound,#btnMenu{display:none}
  .main{gap:7px;min-height:0;flex:1}
  .view{gap:7px}
  .toolbar{gap:5px}
  /* DAILY: date bar shares its row with + BLOCK and TODAY, like on a computer */
  .toolbar .datenav{flex:1 1 0;min-width:120px;width:auto!important;padding:2px 4px}
  .toolbar .datenav .d{font-size:14px}
  .toolbar .datenav .d span{font-size:8px;letter-spacing:1.4px}
  .toolbar .datenav .navbtn{width:26px;height:26px}
  #viewDay .toolbar .spacer{display:none}
  #btnGrade{order:5;flex:1 1 100%}
  .btn.sm{font-size:12.5px;padding:5px 8px 6px}
  .gridwrap,.listwrap,.tkwrap{height:auto;flex:1;min-height:0}
  .gridwrap{padding:6px 6px 18px}
  .grid{grid-template-columns:44px 1fr}
  .nowline,.edge{left:44px}
  .nowline b{left:-44px;font-size:10px}
  .edge b{left:-44px;font-size:10px}
  .tl{font-size:11px;padding-right:6px}
  .cell:hover{background:none;box-shadow:none}
  .cell:hover::after{content:none}
  .blk:hover{transform:none;box-shadow:0 3px 0 rgba(0,0,0,.5)}
  .rz{height:16px}
  .daybody{flex-direction:column}
  .dayinfo{display:none}
  .listwrap{padding:9px}
  /* calendar: compact cells */
  .calwrap{padding:6px}
  .calgrid,.dow{gap:3px}
  .day{min-height:0;padding:3px 3px 6px;border-width:2px;border-radius:7px;gap:2px}
  .day .cq{font-size:8px;padding:0 2px;border-width:1px}
  .day .ev .tm{display:none}
  .dow{top:-6px;margin:-6px -6px 4px;padding:6px 6px 4px}
  .calmon{font-size:14px;padding-top:8px}
  .day:hover{transform:none}
  .day .n{font-size:13px}
  .day .n em{font-size:9px}

  .tkadd .btn{flex:1 1 auto}
  /* modals: full width, 16px inputs so iOS doesn't zoom */
  .scrim{padding:8px;place-items:end center}
  .modal{max-height:92dvh;padding:13px;border-radius:14px}
  .modal h3{font-size:21px}

  .gcard:hover{transform:none}
